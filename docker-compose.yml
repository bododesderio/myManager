services:
  postgres:
    image: postgres:16-alpine
    container_name: mymanager-postgres
    environment:
      POSTGRES_USER: mymanager
      POSTGRES_PASSWORD: mymanager_dev
      POSTGRES_DB: mymanager_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mymanager-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mymanager-api
    # Root .env supplies NEXTAUTH_SECRET; apps/api/.env supplies the api-only
    # secrets the env-validation requires (JWT_SECRET ≥32, ENCRYPTION_KEY 64-hex)
    # plus the social-OAuth provider creds. Both are gitignored — see
    # .env.example for the required keys. The `environment:` block below wins over
    # both env_files, pinning the in-network DB/Redis/URLs regardless of the
    # host-oriented values in apps/api/.env.
    env_file:
      - .env
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://mymanager:mymanager_dev@postgres:5432/mymanager_dev
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3001
      WEB_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://web:3000
    ports:
      - "3001:3001"
    volumes:
      # Persist runtime-uploaded media across container rebuilds (local storage
      # driver writes to ./uploads). Survives `up -d --build`; cleared only by
      # `down --volumes`.
      - uploads_data:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mymanager-web
    env_file:
      - .env
    environment:
      NEXTAUTH_URL: http://localhost:3000
      # No default: a missing session secret must fail loudly at startup, never
      # silently fall back to a public placeholder that would let anyone forge
      # sessions. `?err` makes compose abort with this message.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set (min 32 chars)}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    container_name: mymanager-worker
    # Same secret sourcing as the api — the worker decrypts OAuth tokens
    # (ENCRYPTION_KEY) and needs JWT_SECRET/provider creds for publishing jobs.
    env_file:
      - .env
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://mymanager:mymanager_dev@postgres:5432/mymanager_dev
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*worker-main' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
